<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{{ config.title }}{% endblock %}</title>
        <link rel="stylesheet" href="{{ get_url(path='index.css') }}" />
        <link rel="canonical" href="{{ current_url }}" />
        <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml') }}" />
        <!-- opengraph -->
        <meta
            property="og:title"
            content="{% block og_title %}{{ config.title }}{% endblock %}"
        />
        <meta
            property="og:description"
            content="{% block og_description %}{{ config.description }}{% endblock %}"
        />
        <meta property="og:url" content="{{ current_url }}" />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="en_GB" />

        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": "{{ config.title }}",
                "datePublished": "{{ now() | date(format="%Y-%m-%d") }}",
                "author": { "@type": "Person", "name": "lexffe" }
            }
        </script>
    </head>
    <body>
        {% block content %}{% endblock %}
    </body>
</html>
