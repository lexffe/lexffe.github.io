{% extends "base.html" %}
{% block title %}{{ page.title }} — lexffe{% endblock %}
{% block opengraph %}
<meta
    property="og:title"
    content="{% block og_title %}{{ page.title }}{% endblock %}"
/>
<meta
    property="og:description"
    content="{% block og_description %}{{ page.description }}{% endblock %}"
/>
<meta property="og:type" content="article" />
<meta property="article:published_time" content="{{ now() | date(format="%Y-%m-%d") }}" />
{% endblock %}
{% block content %}
<main>
    <article>
        <header>
            <h1>{{ page.title }}</h1>
            <p><i>{{ page.description }}</i></p>
            <time datetime="{{ page.date }}"
                >{{ page.date | date(format="%B %d, %Y") }}</time
            >
        </header>
        <hr />
        <section>{{ page.content | safe }}</section>
    </article>
</main>
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{ page.title }}",
        "description": "{{ page.description }}",
        "url": "{{ current_url }}",
        "datePublished": "{{ now() | date(format="%Y-%m-%d") }}",
        "author": { "@type": "Person", "name": "lexffe" }
    }
</script>
{% endblock %}
